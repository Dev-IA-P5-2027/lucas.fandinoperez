# docker-compose.yml 

services: 

  api: 

    build: .                      # Construire l'image depuis le Dockerfile local 

    ports: 

      - "8000:8000"               # Exposer le port 8000 

    volumes: 

      - donnees:/data             # Monter le volume nommé pour la base SQLite 

    restart: unless-stopped       # Redémarrer auto en cas d'erreur 

 

volumes: 

  donnees:                        # Volume nommé géré par Docker 